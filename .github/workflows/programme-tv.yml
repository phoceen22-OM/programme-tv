name: Programme TV du soir

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: programme-tv
  cancel-in-progress: false

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generer le guide (HTML + PDF)
        run: node outils/generer-programme-tv.mjs
      - name: Preparer la page web
        run: |
          mkdir -p public
          cp programmes-tv/programme-tv-du-jour.html public/index.html
          if [ -f programmes-tv/programme-tv-du-jour.pdf ]; then cp programmes-tv/programme-tv-du-jour.pdf public/programme-tv.pdf; fi
      - name: Enregistrer dans le depot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A programmes-tv
          git commit -m "Programme TV du $(date +%F)" || echo "aucun changement"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: generer
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
